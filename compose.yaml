services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pvp
      POSTGRES_PASSWORD: pvp-local-only
      POSTGRES_DB: pvpreferee
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pvp -d pvpreferee']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
